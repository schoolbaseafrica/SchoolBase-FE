name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'skip ci'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Pull from dev
        run: |
          git fetch origin dev
          git merge origin/dev --no-edit
      
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build application
        run: pnpm build
        
      - name: Create deployment archive
        run: tar -czf build.tar.gz .next/ package.json pnpm-lock.yaml
          
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build.tar.gz"
          target: "/tmp/"
          
      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Set environment variables
            if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              APP_NAME="fe-staging-schoolbase"
              APP_DIR="/home/ubuntu/open-school/staging/open-school-portal-FE"
              PORT="3003"
            else
              APP_NAME="fe-prod-schoolbase"
              APP_DIR="/home/ubuntu/open-school/prod/open-school-portal-FE"
              PORT="3002"
            fi
            
            # Install pnpm if not exists
            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm
            fi
            
            # Create app directory if not exists
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            # Extract build
            tar -xzf /tmp/build.tar.gz -C .
            
            # Install production dependencies
            pnpm install --prod --no-frozen-lockfile
            
            # Reload or start PM2 process
            pm2 reload $APP_NAME || pm2 start "pnpm next start -p $PORT" --name $APP_NAME
            
            # Check PM2 status
            pm2 list
            pm2 status $APP_NAME
            
            # Cleanup
            rm -f /tmp/build.tar.gz