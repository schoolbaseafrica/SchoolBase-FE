name: CD - Deploy

on:
  push:
    branches: [main, staging]
  workflow_run:
    workflows: ["CI - Build and Lint"]
    types: [completed]
    branches: [main, staging]

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          tar -czf build-${{ github.sha }}.tar.gz .next/ node_modules/ package.json pnpm-lock.yaml
          
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              cd /home/ubuntu/open-school/prod/open-school-portal-FE
              git pull origin main
            elif [ "$BRANCH" = "staging" ]; then
              cd /home/ubuntu/open-school/staging/open-school-portal-FE
              git pull origin staging
            fi
            
      - name: Upload and extract build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build-${{ github.sha }}.tar.gz"
          target: "/tmp/"
          
      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
            SHA="${{ github.sha }}"
            if [ "$BRANCH" = "main" ]; then
              cd /home/ubuntu/open-school/prod/open-school-portal-FE
              tar -xzf /tmp/build-$SHA.tar.gz
              pm2 restart fe-prod-schoolbase || pm2 start "pnpm next start -p 3002" --name fe-prod-schoolbase
            elif [ "$BRANCH" = "staging" ]; then
              cd /home/ubuntu/open-school/staging/open-school-portal-FE
              tar -xzf /tmp/build-$SHA.tar.gz
              pm2 restart fe-staging-schoolbase || pm2 start "pnpm next start -p 3003" --name fe-staging-schoolbase
            fi
            # Cleanup
            rm -f /tmp/build-$SHA.tar.gz