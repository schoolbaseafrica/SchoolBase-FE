name: CI - Build and Lint

on:
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Run lint
        run: pnpm lint
        
      - name: Security audit and auto-fix
        run: |
          echo "Running security audit..."
          pnpm audit --audit-level high || true
          
          # Check for vulnerabilities and print details
          AUDIT_OUTPUT=$(pnpm audit --json 2>/dev/null || echo '{}')
          
          if echo "$AUDIT_OUTPUT" | grep -q '"severity":"high"\|"severity":"critical"'; then
            echo "❌ High or critical vulnerabilities found:"
            echo "$AUDIT_OUTPUT" | jq -r '.advisories[] | select(.severity == "high" or .severity == "critical") | "Package: \(.module_name) | Severity: \(.severity) | Title: \(.title)"'
            
            echo "🔧 Attempting to fix vulnerabilities..."
            pnpm audit --fix
            
            # Check if fixes were applied
            FIXED_AUDIT=$(pnpm audit --json 2>/dev/null || echo '{}')
            if echo "$FIXED_AUDIT" | grep -q '"severity":"high"\|"severity":"critical"'; then
              echo "❌ Some vulnerabilities could not be auto-fixed. Manual intervention required."
              exit 1
            else
              echo "✅ All vulnerabilities have been automatically fixed!"
            fi
          else
            echo "✅ No high or critical vulnerabilities found"
          fi
          
      - name: Commit vulnerability fixes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if ! git diff --quiet pnpm-lock.yaml; then
            git add pnpm-lock.yaml package.json
            git commit -m "fix: auto-fix security vulnerabilities [skip ci]"
            git push
            echo "🔒 Security fixes committed and pushed"
          else
            echo "📝 No package changes to commit"
          fi
        
      - name: Build application
        run: pnpm build
        
      - name: Create build archive
        run: |
          tar -czf build-${{ github.sha }}.tar.gz .next/ node_modules/ package.json pnpm-lock.yaml
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build-${{ github.sha }}.tar.gz
          retention-days: 1