name: Docker Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy frontend services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/open-school/openschool-docker/fe
            git pull origin main
            cd ..
            # Zero-downtime deployment: build new images first
            docker-compose build frontend-stpaul frontend-demo
            # Rolling update: update one service at a time
            docker-compose up -d --no-deps frontend-stpaul
            sleep 10
            docker-compose up -d --no-deps frontend-demo